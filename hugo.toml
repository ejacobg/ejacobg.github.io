baseURL = 'https://ejacobg.com/'
locale = 'en-us'
title = 'Ean Jacob Gayban'
theme = 'ejacobg'
publishDir = 'docs'
ignoreFiles = ['drafts/*'] # comment this out when building locally to include drafts

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = true

[security]
allowContent = ['! ^text/org$'] # Hugo 0.16x denies HTML content files by default; content/tests/dropin.html needs it

[params]
mainSections = ['blog', 'notes', 'projects']
